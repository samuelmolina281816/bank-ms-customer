spring.application.name=bank-ms-customer
spring.profiles.active=local

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},vault://
spring.cloud.config.enabled=${CONFIG_SERVER_ENABLED:true}
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.kv.application-name=banca-project/${spring.application.name}

springdoc.swagger-ui.url=/openapi.yaml

spring.r2dbc.url=${CUSTOMER_R2DBC_URL}
spring.r2dbc.username=${CUSTOMER_DB_USERNAME}
spring.r2dbc.password=${CUSTOMER_DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=@@

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.root=INFO
logging.level.com.nttdata.bank_ms_customer=INFO
